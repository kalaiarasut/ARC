org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true

# Kotlin incremental cache corruption/locking has been observed on Windows
# ("Storage ... is already registered" / "Could not close incremental caches").
# These settings trade build speed for stability.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
